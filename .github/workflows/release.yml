name: 🚀 Release the plugin
on:
  release:
    types: [released]
jobs:
  build-release:
    name: 🎉 New Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Install Node dependencies
        uses: ./.github/actions/node-dependencies

      - name: Build assets
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer, php-scoper, phpcbf

      - name: Install Composer dependencies in build
        run: composer install --no-dev --no-interaction

      - name: Run PHP-Scoper
        run: php-scoper add-prefix --config=config/scoper.php --output-dir=build

      - name: Merge scoped files
        run: cp -r ./build/* . && rm -rf build

      - name: Dump autoload
        run: composer dump-autoload --classmap-authoritative -o

      - name: Format Scoped codes
        run: phpcbf build -q -n --standard="PSR12,PSR1" || true

      - name: 🚀 Deploy plugin to wordpress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SLUG: product-specifications
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.deploy.outputs.zip-path }}" "./${{ github.event.release.name }}.zip"
          gh release upload "${{ github.event.release.tag_name }}" "./${{ github.event.release.name }}.zip" --clobber
