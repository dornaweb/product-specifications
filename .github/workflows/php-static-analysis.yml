name: 🔍 PHP static analysis

on:
  push:
    branches: [main]
    paths:
      - "src/**/*.php"
      - "inc/**"
      - "tests/php/**"
      - "product-specifications.php"
      - "composer.json"
      - "composer.lock"
      - "phpstan.neon.dist"
      - ".phpstan/**"
      - ".github/actions/**"
      - ".github/workflows/php-static-analysis.yml"
  pull_request:
    paths:
      - "src/**/*.php"
      - "inc/**"
      - "tests/php/**"
      - "product-specifications.php"
      - "composer.json"
      - "composer.lock"
      - "phpstan.neon.dist"
      - ".phpstan/**"
      - ".github/actions/**"
      - ".github/workflows/php-static-analysis.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-dependencies
        with:
          php-version: ${{ matrix.php }}

      - run: composer phpstan -- --no-progress
